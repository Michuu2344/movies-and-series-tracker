<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="registerstyle.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>

    <div class ="container mt-5" style="max-width: 500px;">
        <img src="images/mvslogo_nobg.png" class="d-block mx-auto" style="width: 100px;height: auto;">
        <h2 style="text-align: center;">Sign up </h2>
        <form id="registerForm" class="card p-4">
            <input type = "text" id = "email" class="form-control mb-3" placeholder="Email"> 
            
            <input type="text" id="username" class="form-control mb-3" placeholder="Username">
        
            <input type="text" id="fullname" class="form-control mb-3" placeholder="Full name">
            <input type = "password" id = "password" class="form-control mb-3" placeholder="Password"> 
        <button type = "submit" class="btn btn-success">Create account</button>
        <p id="message" class="mt-3 text-danger text-center" ></p>
    </form>
    <p class="text-center mt-3">
        Already have an account 
        <a href="index.html">Sign in</a>
    </p>
    <script src="register.js"></script>
</body>
</html>
