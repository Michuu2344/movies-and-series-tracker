<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div class ="container mt-5" style="max-width: 500px;">
        <h2 style="text-align: center;">Sign up for Movies and Series tracker</h2>
        <form id="loginForm" class="card p-4">
            <input type = "text" id = "email" class="form-control mb-3" placeholder="Email"> 
            
            <input type="text" id="username" class="form-control mb-3" placeholder="Username">
        
            <input type="text" id="fullname" class="form-control mb-3" placeholder="Full name">
            <input type = "password" id = "password" class="form-control mb-3" placeholder="Password"> 
        <button type = "submit" class="btn btn-primary">Zaloguj</button>
        <p id="message" class="mt-3 text-danger text-center" ></p>
    </form>
</body>
</html>
