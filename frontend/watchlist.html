<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
   <form id="searchForm" class="container mb-4" style = "max-width: 500px;">
    <div class="d-flex justify-content-center mb-3">
        <div class = "btn-group w-100" role="group" ariab-label="Media type selection">
            <input type = "radio" class="btn-check" name="mediatype" id="mediaMovie" value="movie" checked>
            <label class="btn btn-outline-primary" for="mediaMovie"> 🎥 Movies </label>

            <input type="radio" class ="btn-check" name="mediatype" id="mediaTV" value="tv">
            <label for="mediaTV" class="btn btn-outline-primary">📺 TV Series</label>
        </div>
    </div>
   
 
    <div class = "container mt-5" style="max-width: 500px;">
        <form id="watchlistSearch" class="card p-4">
        <label for="search_watchlist" class="form-label">Search</label>
        <input type="text" id="search_watchlist" class = "form-control mb-3" placeholder="Enter a movie or a tv show">
        <button type="submit" class="btn btn-primary" >Search</button>
  
    </div>
    </form>
    <div id="results" class="container mt-4">

    </div>
    
    
    
    <script src ="watchlist.js"></script>
</body>
</html>
