<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="watchliststyle.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg custom-nav" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="menu.html">
          <img src="images/mvslogo_nobg.png" alt="" width="50" height="auto" style="background-color: #1F2937;border-radius: 12px ;" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="menu.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="browse.html">Explore</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" style="font-weight: bold;" aria-current="page" href="watchlist.html">Watchlist</a>
            </li>
            
          </ul>
          <form id="navSearchForm" class="d-flex" role="search">
            <div class="custom-search-group">
              <select
                class="custom-select"
                id="navMediaType"
                style="max-width: 150px"
              >
                <option value="movie" selected>🎥 Movies</option>
                <option value="tv">📺 TV Series</option>
              </select>
              <div class="search-input-wrapper">
              <input
                class="custom-input"
                id="navSearchInput"
                type="search"
                placeholder="Search..."
                aria-label="Search"
              />
                
              <button class="custom-btn" type="submit" id="navSearchBtn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
          </svg>
              </button>
              </div>
            </div>
          </form>
           <div class="ms-auto d-flex align-items-center gap-3">
          <a class="nav-link register-text" id="authLink" href="index.html">Sign in</a>
          <a class="nav-link profile-picture" href="#"><img class="profilepic" src="images/profile_img.png"  alt="profile"></a>
            </div>
        </div>
      </div>
    </nav>

    <div id="results" class="container mt-4"></div>
    <template id="movieCardTemplate">
  <div class="card watch-card mb-4 mx-auto">
    <div class="row g-0 h-100 card-row">
      <div class="col-4 col-sm-3 img-row">
        <img class="img-fluid h-100 object-fit-cover movie-poster" alt="thumbnail" />
      </div>

      <div class="col-8 col-sm-9 d-flex flex-column justify-content-between watch-body">
        <div>
          <div class="d-flex justify-content-between align-items-start gap-3 mb-2">
            <h2 class="h4 fw-bold movie-title">Tytuł</h2>

            <button class="btn watchlist-favourite-btn" title="Ulubione" aria-label="Ulubione">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                <path class="heart-svg" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
              </svg>
            </button>
          </div>

          <div class="d-flex align-items-center watch-meta">
            <h3 class="h6 m-0 movie-date">Data</h3>
            <span class="watch-dot">•</span>
            <span class="badge movie-badge">Typ</span>
          </div>
        </div>

        <div class="d-flex align-items-center justify-content-between gap-3 mt-3 watch-footer">
          <div class="dropdown">
            <button class="btn btn-outline-dark dropdown-toggle status-button"
                    type="button"
                    data-bs-toggle="dropdown"
                    data-current-status="want_to_watch">
              Want to watch
            </button>
            <ul class="dropdown-menu dropdown-menu-dark">
              <li><a href="#" class="dropdown-item status-item" data-status="want_to_watch">Want to watch</a></li>
              <li><a href="#" class="dropdown-item status-item" data-status="watching">Watching</a></li>
              <li><a href="#" class="dropdown-item status-item" data-status="completed">Completed</a></li>
              <li><a href="#" class="dropdown-item status-item" data-status="dropped">Dropped</a></li>
            </ul>
          </div>

          <div class="d-flex align-items-center gap-3">
            <div class="watch-rating">
              <span class="watch-star">★</span>
              <span class="fw-bold movie-rating">0.0</span>
            </div>

            <button class="btn watchlist-remove-btn" title="Usuń z listy" aria-label="Usuń z listy">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

    <div class="toast-container position-fixed bottom-0 end-0 p-3 pop-up-mess">
    <div class="toast" id="watchListToast" role="alert" aria-live="assertive" aria-atomic="true">
  <div class="toast-header header-popup">
    <img src="images/mvslogo_nobg.png" style="width: 24px; height: 24px;" class="rounded me-2" alt="...">
    <strong class="me-auto" style="color: aliceblue;"> Movies and Series Tracker</strong>
    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
  </div>
  <div class="toast-body" id="toastMessage">
    Successfully deleted an item from watchlist
  </div>
</div>
</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="watchlist.js"></script>
</body>
</html>
