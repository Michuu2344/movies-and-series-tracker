<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watchlist</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="browsestyle.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg custom-nav" data-bs-theme="dark" >
      <div class="container-fluid">
        <a class="navbar-brand" href="menu.html">
          <img src="images/mvslogo_nobg.png" alt="" width="50" height="50" style="background-color: #1F2937;border-radius: 12px ;" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link " aria-current="page" href="menu.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" style="font-weight: bold" href="browse.html">Explore</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="watchlist.html">Watchlist</a>
            </li>
          </ul>
          <form id="navSearchForm" class="d-flex" role="search">
            <div class="custom-search-group">
              <select
                class="custom-select"
                id="navMediaType"
                style="max-width: 150px"
              >
                <option value="movie" selected>🎥 Movies</option>
                <option value="tv">📺 TV Series</option>
              </select>
              <div class="search-input-wrapper">
              <input
                class="custom-input"
                id="navSearchInput"
                type="search"
                placeholder="Search..."
                aria-label="Search"
              />
                
              <button class="custom-btn" type="submit" id="navSearchBtn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
          </svg>
              </button>
              </div>
            </div>
          </form>
          <div class="ms-auto d-flex align-items-center gap-3">
          <a class="nav-link register-text" id="authLink" href="index.html"></a>
          <a class="nav-link profile-picture" href="#"><img class="profilepic" src="images/profile_img.png"  alt="profile"></a>
            </div>
        </div>
      </div>
    </nav>
    <div class="browse-page" id="browse-page">

  <div class="browse-header">
    <h2>Explore</h2>
    <p>Discover something new</p>
  </div>

  <section class="poster-section">
    
  </section>

  <section class="poster-section">
    <h3>✨ Discover <span class="section-sub">Popular right now</span></h3>
    <div class="poster-row">
      <div class="poster-card"><img src="..." alt=""></div>
      <div class="poster-card"><img src="..." alt=""></div>
      <div class="poster-card"><img src="..." alt=""></div>
      <div class="poster-card"><img src="..." alt=""></div>
      <div class="poster-card"><img src="..." alt=""></div>
    </div>
  </section>

  <section class="poster-section">
    <h3>🔥 Trending</h3>
    <div class="poster-row">
      <div class="poster-card"><img src="..." alt=""></div>
      <div class="poster-card"><img src="..." alt=""></div>
      <div class="poster-card"><img src="..." alt=""></div>
      <div class="poster-card"><img src="..." alt=""></div>
      <div class="poster-card"><img src="..." alt=""></div>
    </div>
  </section>

</div>
    <div id="results" class="container mt-4"></div>
    
    <div class="modal" id="detailsModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" id="modalContent"></div>
      </div>


    </div>



<template id="movieCardTemplate">
  <article class="movie-row">
    <img class="movie-poster" alt="plakat" loading="lazy" />

    <div class="movie-main">
      <h2 class="movie-title">Tytuł</h2>
      <div class="movie-meta">
        <span class="movie-date">Rok</span>
        <span class="movie-dot">•</span>
        <span class="movie-badge">Typ</span>
      </div>
    </div>

    <div class="movie-rating-box">
      <span class="star">★</span>
      <span class="movie-rating">0.0</span>
    </div>

    <button class="watchlist-btn" title="Dodaj do watchlisty" aria-label="Dodaj do watchlisty">
      <svg class="icon-plus" viewBox="0 0 24 24" width="20" height="20" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M12 5v14M5 12h14" />
      </svg>
      <svg class="icon-check" viewBox="0 0 24 24" width="20" height="20" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 13l4 4L19 7" />
      </svg>
    </button>
  </article>
</template>

  
    <template id="modalContentTemplate">
      <div class="modal-header">
        <h5 class="modal-title fw-bold modal-movie-title">Tytuł</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
      </div>
      <div class="modal-body">
        <div class="row g-4">
            <div class="col-md-4">
                <img src="" class="img-fluid rounded shadow modal-movie-poster" alt="Poster">
            </div>
            <div class="col-md-8 d-flex-column justify-content-between">
              <div>
                <div class="d-flex align-items-center gap-3 mb-3">
                    <span class="badge bg-warning text-dark fs-6 modal-movie-rating">
                            ⭐ 0.0
                        </span>
                    </span>
                    <span class="text-muted fw-semibold modal-movie-date">
                        📅 Release Date
                    </span>
                    <span class="text-muted fw-semibold modal-movie-genre">Genre
                    </span>
                </div>
                   <h6 class="fw-bold">Description: </h6>
                    <p class="text-secondary modal-movie-overview" style="line-height: 1.6;">
                        Description....
                    </p>
            </div>
          <div class="mt-3">
            <button class= "btn btn-warning text-dark modal-movie-btn">Add to watchlist</button>
          </div>
          </div>
        </div>
      </div>
    </template>

    <template id="poster-items-row">
      <h3>🕘 Recently Viewed</h3>
    <div class="poster-row">
      <div class="poster-card"><img src="..." class="movie-poster" alt=""></div>
      <div class="poster-card"><img src="..." alt="" class="movie-poster" alt=""></div>
      <div class="poster-card"><img src="..." alt="" class="movie-poster" alt=""></div>
      <div class="poster-card"><img src="..." alt="" class="movie-poster" alt=""></div>
      <div class="poster-card"><img src="..." alt="" class="movie-poster" alt=""></div>
    </div>
    </template>

    <template id="trendingMoviesTemplate">
<div class="col movie-column">
            <div class="movie-card h-100">
                <img
              class="img-fluid movie-poster"
              alt="posterPicture"
              style="min-height: 180px"
            />
</div>
</div>    
</template>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="browse.js"></script>
</body>
</html>
