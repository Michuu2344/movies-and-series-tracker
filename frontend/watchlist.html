<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watchlist</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="mvslogo.png" alt="" width="50" height="auto" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Watchlist</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Search</a>
            </li>
          </ul>
          <form id="navSeachForm" class="d-flex" role="search">
            <div class="input-group">
              <select
                class="form-select"
                id="navMediaType"
                style="max-width: 150px"
              >
                <option value="movie" selected>🎥 Movies</option>
                <option value="tv">📺 TV Series</option>
              </select>

              <input
                class="form-control me-2"
                type="search"
                placeholder="Search"
                style="max-width: 200px"
                aria-label="Search"
              />

              <button class="btn btn-outline-success">Search</button>
            </div>
          </form>
        </div>
      </div>
    </nav>
    <form id="searchForm" class="container mb-4" style="max-width: 500px">
      <div class="d-flex justify-content-center mb-3">
        <div
          class="btn-group w-100"
          role="group"
          ariab-label="Media type selection"
        >
          <input
            type="radio"
            class="btn-check"
            name="mediatype"
            id="mediaMovie"
            value="movie"
            checked
          />
          <label class="btn btn-outline-primary" for="mediaMovie">
            🎥 Movies
          </label>

          <input
            type="radio"
            class="btn-check"
            name="mediatype"
            id="mediaTV"
            value="tv"
          />
          <label for="mediaTV" class="btn btn-outline-primary"
            >📺 TV Series</label
          >
        </div>
      </div>

      <div class="container mt-5" style="max-width: 500px">
        <label for="search_watchlist" class="form-label">Search</label>
        <input
          type="text"
          id="search_watchlist"
          class="form-control mb-3"
          placeholder="Enter a movie or a tv show"
        />
        <button type="submit" class="btn btn-primary">Search</button>
      </div>
    </form>
    <div id="results" class="container mt-4"></div>
    
    <div class="modal" id="detailsModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" id="modalContent"></div>
      </div>


    </div>


    
    
    <template id="modalContentTemplate">
      <div class="modal-header">
        <h5 class="modal-title fw-bold modal-movie-title">Tytuł</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
      </div>
      <div class="modal-body">
        <div class="row g-4">
            <div class="col-md-4">
                <img src="" class="img-fluid rounded shadow modal-movie-poster" alt="Poster">
            </div>
            <div class="col-md-8 d-flex-column justify-content-between">
              <div>
                <div class="d-flex align-items-center gap-3 mb-3">
                    <span class="badge bg-warning text-dark fs-6 modal-movie-rating">
                            ⭐ 0.0
                        </span>
                    </span>
                    <span class="text-muted fw-semibold modal-movie-date">
                        📅 Release Date
                    </span>
                    <span class="text-muted fw-semibold modal-movie-genre">Genre

                    </span>
                </div>
                   <h6 class="fw-bold">Description: </h6>
                    <p class="text-secondary modal-movie-overview" style="line-height: 1.6;">
                        Description....
                    </p>
            </div>
          <div class="mt-3">
            <button class= "btn btn-warning text-dark modal-movie-btn">Add to watchlist</button>
          </div>
          </div>
        </div>
      </div>
    </template>

    
    
    
    
    <template id="movieCardTemplate">
      <div
        class="card mb-4 shadow-sm mx-auto overflow-hidden"
        style="max-width: 750px; border-radius: 15px; cursor: pointer"
      >
        <div class="row g-0 h-100 card-row">
          <div class="col-3">
            <img
              class="img-fluid h-100 object-fit-cover movie-poster"
              alt="thumbnail"
              style="min-height: 180px"
            />
          </div>

          <div class="col-9 d-flex flex-column justify-content-between p-3">
            <div>
              <h2 class="h4 mb-2 fw-bold movie-title">Tytuł</h2>

              <div class="d-flex align-items-center gap-3 mb-3">
                <h3 class="h6 text-muted m-0 movie-date">Data</h3>

                <span class="badge movie-badge">Typ</span>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-2">
              <div class="d-flex align-items-center gap-2">
                <img
                  src="https://t3.ftcdn.net/jpg/01/21/64/88/360_F_121648819_ZQ0tZ6tjLzxim1SG7CQ86raBw4sglCzB.jpg"
                  style="width: 30px; height: 30px; object-fit: contain"
                  alt="rating"
                />

                <p class="m-0 fw-bold fs-5 movie-rating">0.0</p>
              </div>

              <button
                class="btn btn-primary d-flex align-items-center justify-content-center fw-bold fs-4 watchlist-btn"
                style="width: 45px; height: 45px; border-radius: 10px"
              >
                +
              </button>
            </div>
          </div>
        </div>
      </div>
    </template>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="watchlist.js"></script>
  </body>
</html>
