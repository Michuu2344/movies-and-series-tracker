<!-- Hero -->

<section class="hero">

    <div class="container">

        <h1>Find your next movie</h1>

        </p>

        <form class="search-box mt-5" id="homeSearchForm">
            <div class="btn-group w-100 mb-3">

                <input
                    type="radio"
                    class="btn-check"
                    name="media"
                    id="movie"
                    value="movie"
                    checked
                >

                <label class="btn btn-outline-primary" for="movie">
                    🎬 Movies
                </label>

                <input
                    type="radio"
                    class="btn-check"
                    name="media"
                    id="tv"
                    value="tv"
                >

                <label class="btn btn-outline-primary" for="tv">
                    📺 TV Series
                </label>

            </div>

            <div class="input-group">

                <input
                    class="form-control form-control-lg"
                    placeholder="Search movies or TV series..."
                    id="homeSearchInput"
                >

                <button type="submit" class="btn btn-primary">
                    Search
                </button>

            </div>

        </form>

    </div>

</section>
